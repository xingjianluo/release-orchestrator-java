# ===== 发布编排器关键配置项 =====
# 本地状态与制品根目录（制品、发布状态、事件日志、版本登记册、部署指针都在此目录）
release.orchestrator.data-dir=${RELEASE_DATA_DIR:target/release-data}
# 同一发布/发布组并发操作时的互斥锁等待毫秒（超时返回 RELEASE_BUSY / 409）
release.orchestrator.lock-timeout-millis=5000
# 启动时是否自动调和中断状态（先成员发布 RUNNING -> FAILED，再补齐/刷新发布组）
release.orchestrator.recover-on-startup=true
# 发布组一轮并行推进成员时的最大并发度（不同服务并行；同一服务仍按发布锁串行）
release.orchestrator.group-advance-parallelism=8

spring.jackson.serialization.write-dates-as-timestamps=false
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
