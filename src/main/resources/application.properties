# ===== 发布编排器：关键配置项（全部为本地文件路径，离线可用）=====

# 发布状态根目录：发布记录与服务状态（含 append-only 变更历史）以 JSON 原子写盘
release.state-dir=${RELEASE_STATE_DIR:target/release-state}

# 制品库目录：内容寻址制品（.bin 内容 + .json 元数据），相同内容只存一份、绝不静默覆盖
release.artifact-dir=${RELEASE_ARTIFACT_DIR:target/release-state/artifacts}

# 日志：本地可复现，打印输入、关键决策与最终状态
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.github.xingjianluo.releaseorchestratorjava=INFO

spring.main.banner-mode=off
